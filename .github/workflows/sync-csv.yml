name: Sync CSV files
run-name: CSV archive ${{ inputs.orchestration_id || 'manual' }}

on:
  # 手動入口保留；總控只有在所有必要抓取階段成功後才觸發本工作。
  workflow_dispatch:
    inputs:
      source_ref:
        description: "來源 snapshot 的完整 commit SHA；留空用 main"
        type: string
        default: ""
      orchestration_id:
        description: "總控唯一批次識別碼；手動執行可留空"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-all-csv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate immutable source snapshot
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_REF" ] && [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_ref 必須為完整 commit SHA，或留空用 main"
            exit 1
          fi
          if [ -n "$ORCHESTRATION_ID" ] && [[ ! "$ORCHESTRATION_ID" =~ ^daily-[0-9]+-[0-9]+$ ]]; then
            echo "::error::無效的總控批次識別碼"
            exit 1
          fi
      - name: Validate source repository token
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          if [ -z "$SOURCE_REPO_TOKEN" ]; then
            echo "::error::缺少 SOURCE_REPO_TOKEN。請建立可讀取 financeworker86/financial-data-pipeline 的 fine-grained PAT，並加入本 repository 的 Actions secret。"
            exit 1
          fi

      - name: Checkout archive repository
        uses: actions/checkout@v7
        with:
          path: archive
          fetch-depth: 1

      - name: Checkout private source repository
        uses: actions/checkout@v7
        with:
          repository: financeworker86/financial-data-pipeline
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 1

      - name: Synchronize CSV files except listings
        shell: bash
        run: |
          set -euo pipefail

          find archive -type f -iname "*.csv" -delete
          # 來源索引與更正紀錄僅留來源庫；封存庫只複製 CSV。
          rsync -avm --prune-empty-dirs \
            --exclude="*.json" \
            --exclude="*.jsonl" \
            --include="*/" \
            --exclude="*listings*.csv" \
            --exclude="*listings*.CSV" \
            --include="*.csv" \
            --include="*.CSV" \
            --exclude="*" \
            source/ archive/

          csv_count=$(find archive -type f -iname "*.csv" | wc -l | tr -d " ")
          if [ "$csv_count" -eq 0 ]; then
            echo "錯誤：來源 repository 找不到符合條件的 CSV，停止同步以避免清空封存庫。"
            exit 1
          fi

          echo "同步完成，共找到 $csv_count 個 CSV（已排除 listings 相關檔案）。"

      - name: Verify CSV paths and content before publication
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          source, archive = Path("source"), Path("archive")
          commit = subprocess.check_output(["git", "-C", str(source), "rev-parse", "HEAD"], text=True).strip()
          tracked = subprocess.check_output(["git", "-C", str(source), "ls-tree", "-r", "--name-only", "-z", "HEAD"]).decode().split("\0")
          expected = {p for p in tracked if p.lower().endswith(".csv") and "listings" not in Path(p).name.lower()}
          actual = {str(p.relative_to(archive)) for p in archive.rglob("*") if p.is_file() and p.suffix.lower() == ".csv" and ".git" not in p.relative_to(archive).parts}
          if not expected or expected != actual:
              raise SystemExit("CSV paths differ; publication blocked")
          def digest(path):
              result = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      result.update(chunk)
              return result.hexdigest()
          for name in sorted(expected):
              if digest(source / name) != digest(archive / name):
                  raise SystemExit("CSV hash mismatch: " + name)
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write(f"SOURCE_SNAPSHOT={commit}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"Source snapshot: {commit}\n\nVerified CSV files: {len(expected)}\n")
          print(f"Verified {len(expected)} CSV paths and SHA-256 hashes from {commit}")
          PYCODE

      - name: Commit and push changes
        working-directory: archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':(icase)*.csv'

          if git diff --cached --quiet; then
            echo "CSV 沒有變化，無需 commit。"
            exit 0
          fi

          git commit -m "sync: update CSV archive ($(date -u +%Y-%m-%d))" \
            -m "Source-Repository: financeworker86/financial-data-pipeline" \
            -m "Source-Commit: $SOURCE_SNAPSHOT"
          git push origin main
